<!DOCTYPE html>
<html>
    <head><title>Doctor's Appointment Form</title></head>
    <body>       
            <h2 style="text-align: center;">Doctor's Appointment Form</h2>
            <p> Kindly fill out the form to schedule you appointment with the doctor:- </p>
        
        <form>
            <fieldset>
                <legend> Personal Details </legend>
                
                <label>Your Name</label><br>
                <input type="text" id="name" placeholder="Enter your full name"><br><br>
                
                <label>Patient ID</label><br>
                <input type="password" id="ID" placeholder="Kindly Enter you patient ID"><br><br>

                <label>Date of Birth</label><br>
                <input type="date" id="DOB" placeholder="Enter your Date of Birth"><br><br>

            </fieldset>
            <br>
            <fieldset>
                <legend>Your Visit</legend>
                <label>Choose your Doctor:</label><br>
                <select id="Doctor">
                    <option value="">---Choose your Doctor---</option>
                    <option value="">Dr. Ray</option>
                    <option value="">Dr. Aahana</option>
                </select>
            </fieldset>
        </form>
    </body>
</html>
